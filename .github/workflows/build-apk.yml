name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Recreate Android Project and Build
        run: |
          flutter create -t app --org com.ctrlfinance --project-name ctrl_finance_app new_flutter_app
          # Force update kotlin version in android settings and build
          sed -i -e 's/version "1.[0-9]*\.[0-9]*"/version "1.9.24"/g' new_flutter_app/android/settings.gradle || true
          sed -i -e "s/ext.kotlin_version = '<latest-version>'/ext.kotlin_version = '1.9.24'/g" new_flutter_app/android/build.gradle || true
          sed -i -e "s/ext.kotlin_version = '1.*'/ext.kotlin_version = '1.9.24'/g" new_flutter_app/android/build.gradle || true
          cp -R flutter_app/lib/* new_flutter_app/lib/
          cp flutter_app/pubspec.yaml new_flutter_app/pubspec.yaml
          cd new_flutter_app
          flutter pub get
          flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CtrlFinance-Release-APK
          path: new_flutter_app/build/app/outputs/flutter-apk/app-release.apk
